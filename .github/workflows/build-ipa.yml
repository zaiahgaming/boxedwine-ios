name: Build Boxedwine iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone Boxedwine Engine
        run: |
          git clone --depth=1 https://github.com/danoon2/Boxedwine.git Boxedwine
          echo "Boxedwine cloned. Source file count:"
          find Boxedwine/source -name "*.cpp" | wc -l
          
          # Patch SDL2: remove -Werror that breaks its own iOS source files
          sed -i '' 's/-Werror=declaration-after-statement/-Wno-error=declaration-after-statement/g' Boxedwine/lib/sdl2/CMakeLists.txt
          # Patch SDL2: add OBJC language so .m files compile correctly on iOS
          sed -i '' 's/project(SDL2 C CXX)/project(SDL2 C CXX OBJC)/' Boxedwine/lib/sdl2/CMakeLists.txt
          # Patch SDL2: REMOVE the lines that force .m files to LANGUAGE C (the root cause!)
          sed -i '' '/PROPERTIES LANGUAGE C/d' Boxedwine/lib/sdl2/CMakeLists.txt
          sed -i '' '/FIXME: modern CMake/d' Boxedwine/lib/sdl2/CMakeLists.txt
          echo "SDL2 patched: -Werror removed, OBJC added, LANGUAGE C removed"
          
          # Patch Boxedwine: fix RamPage cast compilation error
          perl -pi -e 's/RAM_TYPE value = 0;/RAM_TYPE value = 0; RamPage() = default; template<typename T> explicit RamPage(T v) : value((RAM_TYPE)v) {}/g' Boxedwine/source/emulation/softmmu/soft_ram.h
          echo "Boxedwine patched: soft_ram.h RamPage constructors added"
          
          # Patch Boxedwine: fix missing GL types on iOS
          perl -pi -e 's/#define __GLCOMMON_H__/#define __GLCOMMON_H__\n#include <GL\/glew.h>\ntypedef unsigned short GLhalfNV;\n#ifndef APIENTRY\n#define APIENTRY\n#endif\n#ifndef GL_DEBUGPROC\n#define GL_DEBUGPROC GLDEBUGPROC\n#endif/g' Boxedwine/source/opengl/glcommon.h
          perl -pi -e 's/#include <SDL_opengl.h>/#include <GL\/glew.h>\n#ifndef GLAPI\n#define GLAPI extern\n#endif\n#ifndef GLAPIENTRY\n#define GLAPIENTRY\n#endif\n#include <SDL_opengl.h>/g' Boxedwine/lib/mesa/include/osmesa.h
          echo "Boxedwine patched: glcommon.h and osmesa.h include GL/glew.h with GLAPI and APIENTRY defined"

          # Patch Boxedwine: stub downloadFile on iOS (libcurl is not present in iPhoneOS.sdk)
          perl -0777 -pi -e 's/#else\s*#include <curl\/curl.h>/#elif defined(BOXEDWINE_IOS)\nbool downloadFile(BString url, BString filePath, std::function<void(U64 bytesCompleted)> f, NetworkProxy* proxy, BString& errorMsg, bool* cancel) { return false; }\n#else\n#include <curl\/curl.h>/g' Boxedwine/source/util/networkutils.cpp
          echo "Boxedwine patched: networkutils.cpp stubbed for iOS"

      - name: Generate Xcode Project via CMake
        run: |
          mkdir -p build-ios
          cd build-ios
          cmake -G Xcode \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_SYSROOT=iphoneos \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                ..

      - name: Build iOS App
        run: |
          cd build-ios
          xcodebuild build \
                     -project BoxedwineGame.xcodeproj \
                     -scheme BoxedwineGame \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          echo "=== Locating .app bundle containing binary ==="
          EXEC_PATH=$(find build-ios -name "BoxedwineGame" -type f -perm +111 2>/dev/null || find build-ios -name "BoxedwineGame" -type f | head -1)
          if [ -n "$EXEC_PATH" ]; then
            APP_PATH=$(dirname "$EXEC_PATH")
          else
            APP_PATH=$(find build-ios -name "BoxedwineGame.app" -type d -not -empty | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app with binary not found! Listing build-ios structure:"
            find build-ios -type f -name "BoxedwineGame*"
            exit 1
          fi
          
          echo "Found: $APP_PATH"
          echo "=== Binary check ==="
          ls -la "$APP_PATH/BoxedwineGame" 2>/dev/null && file "$APP_PATH/BoxedwineGame" || echo "No binary found"
          ls -la "$APP_PATH/"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BoxedwineGame-Release.ipa Payload
          
          echo "=== IPA Created ==="
          ls -lh BoxedwineGame-Release.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoxedwineGame-iOS-IPA
          path: BoxedwineGame-Release.ipa
          retention-days: 30
