name: Build Boxedwine iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Build Directory & Run CMake
        run: |
          mkdir -p build-ios
          cd build-ios
          cmake -G Xcode \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_SYSROOT=iphoneos \
                ..

      - name: Build iOS Archive with Xcode
        run: |
          cd build-ios
          xcodebuild archive \
                     -scheme BoxedwineGame \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath BoxedwineGame.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package Payload & Create .ipa File
        run: |
          mkdir -p Payload
          cp -r build-ios/BoxedwineGame.xcarchive/Products/Applications/*.app Payload/
          zip -r BoxedwineGame-Release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxedwineGame-iOS-IPA
          path: BoxedwineGame-Release.ipa
          retention-days: 14
